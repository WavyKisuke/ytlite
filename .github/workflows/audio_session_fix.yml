name: Audio Session Fix Documentation

# This file documents the audio session fix for the mute button takeover issue
# The actual fix needs to be implemented in YTLite.x

# PROBLEM:
# When muting YouTube videos, the app takes over system audio and pauses background music
# This happens because the audio session is configured incorrectly

# SOLUTION:
# Add proper AVAudioSession configuration to allow mixing with other audio sources
# The fix should be applied to YTLite.x file

# Implementation details:
# 1. Configure AVAudioSession with .playback category
# 2. Set options to .duckOthers or .mixWithOthers
# 3. Add AVAudioSession.sharedInstance() configuration hook
# 4. Apply before playback initialization

# The fix requires:
# - Adding #import <AVFoundation/AVFoundation.h> to YTLite.h
# - Adding a method hook to initialize audio session properly
# - Ensuring audio session is set when player loads
